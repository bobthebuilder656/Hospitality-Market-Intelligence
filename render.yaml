# Tells Render how to run the tool. Render reads this file from the repository
# when the service is created ("New → Blueprint").
services:
  - type: web
    name: hospitality-intel
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    # Installs the packages, then downloads the private articles and case studies.
    buildCommand: npm ci && node scripts/fetch-content.js
    startCommand: npm start
    healthCheckPath: /api/health
    # Deploy a change only after the Evals run on GitHub has passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # The private repository holding the articles, and a token that can read it.
      # Render asks for these two values when the service is created.
      - key: CONTENT_REPO
        sync: false
      - key: CONTENT_TOKEN
        sync: false
      # Unlocks preview of unpublished articles: add ?preview=1&key=<this value> to the address.
      # Render generates the value; read it in the service's Environment page.
      - key: PREVIEW_KEY
        generateValue: true
