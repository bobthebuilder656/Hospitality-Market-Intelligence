# Extra checks that do not run with every build of the site (site.yml runs the
# main checks before each publish):
#  - every Monday, 08:00 India time: every source and reference link in the
#    articles, case studies and events still opens
#  - on a pull request: the full checks on the proposed change
#  - on demand: Actions > Evals > Run workflow
#
# Settings it needs (Settings > Secrets and variables > Actions):
#   Secret    CONTENT_TOKEN  a token that can read the private articles repository
#   Variable  CONTENT_REPO   owner/name of that repository
#
# The report for each run is attached to it (open report.html).

name: Evals

on:
  pull_request:
  schedule:
    - cron: "30 2 * * 1" # Mondays, 08:00 India time
  workflow_dispatch:

jobs:
  checks:
    name: Full checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Get the private articles and case studies
        if: vars.CONTENT_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_TOKEN }}
          path: content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run evals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: evals/report.html

  links:
    name: External links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get the private articles and case studies
        if: vars.CONTENT_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_TOKEN }}
          path: content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run evals:links
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: links-report
          path: evals/report.html
